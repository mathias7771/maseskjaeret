<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Måseskjæret kontorplasser</title>
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: to visninger (plantegning / månedskalender). Plantegning til venstre, smal sidekolonne med valgt pult — stabler seg på mobil. */
:root {
  --bg: #eef2f3; --surface: #ffffff; --surface2: #f6f8f9; --ink: #14202a; --muted: #5a6a76; --line: #d3dce1;
  --accent: #0e6e78; --accent-ink: #ffffff; --accent-soft: #d5eced;
  --wall: #26323c; --wall2: #8e9ca6; --wall3: #b9c4cb; --furn: #dde4e8; --area: #e9eef0; --planbg: #fbfcfc;
  --free: #5fc28e; --free-soft: #d7f1e3; --booked: #ea8a73; --booked-soft: #f8ddd5;
  --partial: #b08be8; --partial-soft: #ebe1fa; --fixed: #7fa9de; --fixed-soft: #dbe7f6;
  --mine: #e2a71e; --mine-soft: #fbedc6; --unknown: #c9d2d8; --danger: #b4402c; --deskink: #14202a; --wkend: #e4e8f1; --wkend-ink: #59627a; --hol: #fbe0e0; --hol-line: #e9a8a8;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1619; --surface: #172126; --surface2: #1c282e; --ink: #e6eef1; --muted: #93a5ae; --line: #2c3b42;
  --accent: #4cc0c9; --accent-ink: #062226; --accent-soft: #163a3e;
  --wall: #d5dee3; --wall2: #6c7d87; --wall3: #45545c; --furn: #26343b; --area: #1d2a30; --planbg: #131c20;
  --free: #4fb882; --free-soft: #173a29; --booked: #e07c64; --booked-soft: #3e2219;
  --partial: #a585e0; --partial-soft: #2e2445; --fixed: #6f9bd6; --fixed-soft: #1b2c42;
  --mine: #f0bd3e; --mine-soft: #3d3112; --unknown: #3a484f; --danger: #f08a74; --deskink: #0c1418; --wkend: #1e2530; --wkend-ink: #94a0b8; --hol: #3a1d20; --hol-line: #7a3a3f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1619; --surface: #172126; --surface2: #1c282e; --ink: #e6eef1; --muted: #93a5ae; --line: #2c3b42;
  --accent: #4cc0c9; --accent-ink: #062226; --accent-soft: #163a3e;
  --wall: #d5dee3; --wall2: #6c7d87; --wall3: #45545c; --furn: #26343b; --area: #1d2a30; --planbg: #131c20;
  --free: #4fb882; --free-soft: #173a29; --booked: #e07c64; --booked-soft: #3e2219;
  --partial: #a585e0; --partial-soft: #2e2445; --fixed: #6f9bd6; --fixed-soft: #1b2c42;
  --mine: #f0bd3e; --mine-soft: #3d3112; --unknown: #3a484f; --danger: #f08a74; --deskink: #0c1418; --wkend: #1e2530; --wkend-ink: #94a0b8; --hol: #3a1d20; --hol-line: #7a3a3f; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
.wrap { max-width: 1380px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.7rem; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.topright { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 7px 14px; border-radius: 7px; font-size: 0.92rem; }
.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.me { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 0.9rem; }
.me img { width: 26px; height: 26px; border-radius: 50%; }

.banner { border-radius: 10px; padding: 10px 14px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }
.banner.warn { background: var(--booked-soft); border-color: transparent; color: var(--ink); }

.days { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 40px; padding: 0 12px; font-weight: 500; }
.iconbtn:hover { border-color: var(--accent); }
.daylist { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, .62fr)); gap: 6px; flex: 1 1 560px; min-width: 0; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day:hover { border-color: var(--accent); }
.day[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.day .dname { font-family: var(--f-display); font-weight: 600; font-size: 0.95rem; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today-tag { font-family: var(--f-body); font-weight: 600; font-size: 0.68rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-left: 4px; }
.dcount { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 5px; border-radius: 3px; background: var(--free-soft); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .b1 { background: var(--booked); } .bar .b2 { background: var(--partial); }
.jump { display: flex; gap: 6px; align-items: center; }
.jump input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 40px; padding: 0 8px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.planbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.planhead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.planhead h2 { font-size: 1.15rem; text-transform: capitalize; }
.planscroll { overflow-x: auto; border-radius: 10px; background: var(--planbg); }
#plan { display: block; width: 100%; min-width: 720px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.sw.mineframe { background: transparent; border: 3px solid var(--mine); }

/* plan */
.w-hash, .w-D { fill: var(--wall); } .w-g, .w-G { fill: var(--wall2); } .w-l { fill: var(--wall3); }
.w-b { fill: var(--accent); opacity: .55; } .f-c, .f-y, .f-k, .f-v { fill: var(--furn); } .f-w { fill: var(--area); }
.lbl { fill: var(--muted); font-family: var(--f-body); font-size: 26px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
.lbl.big { font-size: 30px; fill: var(--accent); font-weight: 600; }
.desk { cursor: pointer; }
.desk .body { transition: fill .15s; }
.desk .frame { fill: none; stroke: var(--wall2); stroke-width: 2.5; }
.desk.mine .frame { stroke: var(--mine); stroke-width: 7; }
.desk:hover .frame { stroke: var(--ink); stroke-width: 5; }
.desk.sel .frame { stroke: var(--accent); stroke-width: 8; }
.desk:focus { outline: none; } .desk:focus-visible .frame { stroke: var(--accent); stroke-width: 8; }
.k-free { fill: var(--free); } .k-booked { fill: var(--booked); } .k-partial { fill: var(--partial); } .k-fixed { fill: var(--fixed); } .k-unknown { fill: var(--unknown); } .k-closed { fill: var(--unknown); opacity: .55; }
.holname { color: var(--danger); font-weight: 600; font-size: 0.8rem; }
.wk { font-family: var(--f-body); font-size: 0.7rem; font-weight: 500; color: var(--muted); }
.cday.hol, .day.hol { background: var(--hol); border-color: var(--hol-line); }
.cday.wkend, .day.wkend { background: var(--wkend); border-color: transparent; color: var(--wkend-ink); cursor: default; }
.cday.wkend:hover, .day.wkend:hover { border-color: transparent; }
.wkname { font-size: 0.78rem; font-weight: 600; color: var(--wkend-ink); }
.calwd.we { color: var(--wkend-ink); }
.holpill { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px; background: var(--hol); color: var(--danger); font-family: var(--f-body); font-size: 0.78rem; font-weight: 600; text-transform: none; vertical-align: middle; }
.wdays { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.wdays legend { font-size: 0.82rem; color: var(--muted); padding: 0; margin-bottom: 4px; }
.tog { position: relative; }
.tog input { position: absolute; opacity: 0; pointer-events: none; }
.tog span { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; font-size: 0.85rem; font-weight: 600; background: var(--surface2); cursor: pointer; user-select: none; }
.tog input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tog input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 600px) { .day.wkend .dcount, .cday.wkend .wkname, .cday .wk { display: none; } .calgrid .cday .cmine { font-size: 0; width: 10px; height: 10px; padding: 0; border-radius: 50%; background: var(--mine); } .calgrid .cday .holname { font-size: 0.6rem; line-height: 1.2; hyphens: auto; } }
.dnum { font-family: var(--f-mono); font-size: 22px; font-weight: 600; fill: var(--deskink); opacity: .65; pointer-events: none; }
.dini { font-family: var(--f-display); font-size: 28px; font-weight: 700; fill: var(--deskink); pointer-events: none; }
.dtime { font-family: var(--f-mono); font-size: 19px; font-weight: 600; fill: var(--deskink); pointer-events: none; }

/* panel */
aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { font-size: 1.05rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.deskhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.deskhead h3 { font-size: 1.4rem; }
.deskhead .room { color: var(--muted); font-size: 0.88rem; }
.timeline { position: relative; height: 26px; border-radius: 6px; background: var(--free-soft); overflow: hidden; }
.timeline i { position: absolute; top: 0; bottom: 0; }
.timeline .t-booked { background: var(--booked); } .timeline .t-fixed { background: var(--fixed); } .timeline .t-mine { background: var(--mine); }
.ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
.occ { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.occ li { display: grid; grid-template-columns: 12px 92px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 0.9rem; }
.occ .dot { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
.occ .when { font-family: var(--f-mono); font-size: 0.85rem; }
.occ .who { min-width: 0; overflow-wrap: anywhere; }
.note { display: block; color: var(--muted); font-style: italic; font-size: 0.85rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; padding: 3px 10px; font-family: var(--f-mono); font-size: 0.82rem; }
.chip:hover { border-color: var(--accent); }
.chip.part { background: var(--partial-soft); }
form { display: flex; flex-direction: column; gap: 10px; margin: 0; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 0.82rem; background: var(--surface2); }
.presets button:hover { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: var(--muted); min-width: 0; }
.field input { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: 0.92rem; color: var(--ink); min-width: 0; width: 100%; }
.btn { border: 0; border-radius: 9px; padding: 10px 14px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.small { padding: 4px 10px; font-size: 0.8rem; font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; }
details[open] summary { margin-bottom: 10px; }
.msg { font-size: 0.86rem; border-radius: 8px; padding: 8px 10px; background: var(--free-soft); }
.msg.err { background: var(--booked-soft); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.88rem; }
.list li:first-child { border-top: 0; }
.list .lt { min-width: 0; overflow-wrap: anywhere; }
.list .lt b { font-weight: 600; text-transform: capitalize; }
.muted { color: var(--muted); font-size: 0.88rem; margin: 0; }
.fixedbox { background: var(--fixed-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }
.fixedbox.mine { background: var(--mine-soft); }

/* calendar */
.calbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.calhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.calhead h2 { font-size: 1.4rem; text-transform: capitalize; }
.calnav { display: flex; gap: 6px; }
.calgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, .7fr)); gap: 6px; }
.calwd { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; padding: 0 4px; }
.cday { border: 1px solid var(--line); background: var(--surface2); border-radius: 10px; padding: 8px 10px; min-height: 96px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cday:hover { border-color: var(--accent); }
.cday.out { opacity: .4; }
.cday.past { opacity: .6; }
.cday.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cday .cnum { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.cday .cfree { font-size: 1.05rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.cday .cfree small { font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.cday .cmine { font-size: 0.74rem; background: var(--mine-soft); border-radius: 4px; padding: 1px 6px; align-self: flex-start; }
@media (max-width: 600px) { .cday { min-height: 74px; padding: 6px; } .cday .cfree small, .cday .cpart { display: none; } .cday .cnum { font-size: 1rem; } }
/* innlogging og admin */
.gate { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; max-width: 560px; }
.gate h2 { font-size: 1.4rem; }
.gate p { margin: 0; color: var(--muted); }
.loginbtns { display: flex; flex-wrap: wrap; gap: 10px; }
.loginbtns .btn { display: inline-flex; align-items: center; gap: 8px; }
.me button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 0 0 0 6px; font-size: 0.85rem; }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.addrow input { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: 0.92rem; min-width: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== v3 tillegg ===== */
.todaybar { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; font-size: 0.86rem; font-weight: 500; }
.todaybar b { font-weight: 700; text-transform: capitalize; }
.day .wkno { font-size: 0.72rem; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.day.today { border: 2px solid var(--mine); padding: 6px 9px; }
.day .todaybadge { display: inline-block; background: var(--mine); color: #1c1606; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.06em; border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
.cday.today { border: 2px solid var(--mine); box-shadow: none; }
.cday.today .cnum > span:first-child { color: var(--ink); }
.cday .todaybadge { background: var(--mine); color: #1c1606; font-family: var(--f-body); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.05em; border-radius: 4px; padding: 1px 5px; text-transform: uppercase; }
.todaypill { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 999px; background: var(--mine); color: #1c1606; font-family: var(--f-body); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; vertical-align: middle; }
.scrollhint { display: none; margin: 0; font-size: 0.78rem; color: var(--muted); }
@media (max-width: 760px) { .scrollhint { display: block; } #plan { min-width: 640px; } }

.field select { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: 0.92rem; color: var(--ink); min-width: 0; width: 100%; }
.hint { font-size: 0.8rem; color: var(--muted); margin: 0; }
.warnbox { background: var(--booked-soft); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; }
.sched { display: flex; flex-direction: column; gap: 6px; }
.schedrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 12px minmax(0, 1fr); gap: 6px; align-items: center; }
.schedrow input[type=time] { border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 6px 8px; font-size: 0.88rem; min-width: 0; width: 100%; color: var(--ink); }
.schedrow input[type=time]:disabled { opacity: .35; }
.schedrow .dash { text-align: center; color: var(--muted); }
.holders { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
.holders li b { font-weight: 600; }
.notice { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; background: var(--booked-soft); border-radius: 8px; padding: 8px 10px; font-size: 0.86rem; }
.inirow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inirow input { width: 70px; text-transform: uppercase; font-family: var(--f-mono); font-weight: 600; text-align: center; border: 1px solid var(--line); background: var(--surface2); border-radius: 8px; padding: 6px 8px; color: var(--ink); }
.who { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.88rem; }
.who li { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
.who li:first-child { border-top: 0; padding-top: 0; }
.who .wd { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.badge { display: inline-block; font-size: 0.7rem; font-weight: 700; border-radius: 4px; padding: 1px 6px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: middle; }

<div class="wrap">
  <header class="top">

      <h1>Måseskjæret</h1>

              <span><i class="sw" style="background:var(--partial)"></i>Delvis booket</span>
              <span><i class="sw" style="background:var(--booked)"></i>Opptatt</span>
              <span><i class="sw" style="background:var(--fixed)"></i>Fast plass</span>
              <span><i class="sw mineframe"></i>Din</span>

          <p class="scrollhint">Sveip sidelengs for å se hele kartet. Du kan også velge plass i listen.</p>

        <aside>
          <div class="card" id="panel"></div>
          <div class="card" id="mine"></div>
          <div class="card" id="admin" hidden></div>
        </aside>
      </main>
    </div>
  </div>

  <div id="viewCal" hidden>
    <section class="calbox">
      <div class="calhead">
        <h2 id="calTitle">–</h2>
        <div class="calnav">
          <button class="iconbtn" id="prevM" aria-label="Forrige måned">←</button>

          <button class="iconbtn" id="nextM" aria-label="Neste måned">→</button>
        </div>
      </div>
      <div class="legend">
        <span><b>Tallet</b> = pulter som er helt ledige</span>
        <span><i class="sw" style="background:var(--booked)"></i>Opptatt</span>
        <span><i class="sw" style="background:var(--partial)"></i>Delvis</span>
        <span><i class="sw" style="background:var(--free-soft)"></i>Ledig</span>
        <span><i class="sw" style="background:var(--wkend)"></i>Helg</span>
        <span><i class="sw" style="background:var(--hol);border:1px solid var(--hol-line)"></i>Helligdag</span>
        <span><i class="sw mineframe"></i>I dag</span>
      </div>
      <div class="calgrid" id="calgrid"></div>
    </section>
  </div>
</div>

  const HOL = {};
  function holidays(y) {

    add(`${y}-01-01`, "Nyttårsdag");
    add(addDays(e, -3), "Skjærtorsdag"); add(addDays(e, -2), "Langfredag");

  const workdaysBetween = (a, b) => { const out = []; if (b < a) [a, b] = [b, a]; for (let d = a; d <= b && out.length < 270; d = addDays(d, 1)) { if (!isWeekend(d) && !holiday(d)) out.push(d); } return out; };

  const WD_NAMES = ["", "man", "tir", "ons", "tor", "fre"];

  const hDays = h => (Array.isArray(h?.days) && h.days.length ? h.days.map(Number) : ALL_DAYS);

  // ---------- state ----------
  const S = {

  const HALF = { am: [WD_S, 12 * 60], pm: [12 * 60, WD_E] };

  // ---------- belegg ----------
  function subtract(base, cuts) {

  }
  const holdersOf = desk => S.holders.get(desk) || [];
  function fixedParts(h, date, bks, aways) { // tidsrom innehaveren faktisk har plassen denne dagen
    const sp = hSpan(h, dow(date)); if (!sp) return [];
    const mine = aways.filter(a => a.uid === h.uid);

  }
  function dayInfo(date, deskId) {
    const hs = holdersOf(deskId);

    for (const h of hs) for (const [s, e] of fixedParts(h, date, bks, aways)) ints.push({ s, e, uid: h.uid, note: h.note || "", src: "fixed", hid: h.id });

  // ---------- plantegning ----------

  // ---------- Nils ----------

  function placeWalker(x, y, rot, bob) {

  }
  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function walkPath(pts, speed) {
    return new Promise(res => {
      const segs = []; let total = 0;
      for (let i = 1; i < pts.length; i++) { const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push([pts[i - 1], pts[i], L]); total += L; }
      const t0 = performance.now();

        if (!walker) return res();

  // ---------- hjelpere for skjemaer ----------
  function withKeep(root, html) { // bevarer det brukeren har skrevet når kortet tegnes på nytt

  const togglesHTML = (prefix, checked) => `<fieldset class="wdays">${ALL_DAYS.map(n => `<label class="tog"><input type="checkbox" id="${prefix}${n}" value="${n}" ${checked.includes(n) ? "checked" : ""}><span>${WD_CAP[n]}</span></label>`).join("")}</fieldset>`;

  function wirePanel() {

  function downloadIcs() {
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const dt = (d, m) => d.replace(/-/g, "") + "T" + toHHMM(m).replace(":", "") + "00";
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Maseskjaeret//Kontorplasser//NO", "CALSCALE:GREGORIAN"];
    for (const b of S.myBookings) lines.push("BEGIN:VEVENT", `UID:${b.id}@maseskjaeret`, `DTSTAMP:${stamp}`, `DTSTART:${dt(b.date, b.s)}`, `DTEND:${dt(b.date, b.e)}`,

    lines.push("END:VCALENDAR");
    const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mine-kontorplasser.ics"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);

          ${S.figure?.img ? `<div class="figprev"><img src="${esc(S.figure.img)}" alt=""><span>${esc(S.figure.name || "")}</span></div>` : ""}
          <label class="field">Navn under figuren<input type="text" id="figName" maxlength="30" value="${esc(S.figure?.name || "Nils")}"></label>

    withKeep(adminEl, html);

    adminEl.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copy(b.dataset.copy)));
    adminEl.querySelectorAll("[data-adm]").forEach(b => b.addEventListener("click", () => {
      const c = S.codes.find(x => x.code === b.dataset.adm); if (!c) return;

      guard(async () => { await db.collection("codes").doc(c.code).set({ name: c.name, member: c.member, admin: !c.admin, at: Date.now() }); flash(c.admin ? `${c.name} er ikke lenger admin.` : `${c.name} er nå admin.`); });
    }));
    adminEl.querySelectorAll("[data-renew]").forEach(b => b.addEventListener("click", () => {

      guard(async () => {

        await db.collection("codes").doc(old.code).delete();

    adminEl.querySelectorAll("[data-revoke]").forEach(b => b.addEventListener("click", () => {
      const c = S.codes.find(x => x.code === b.dataset.revoke); if (!c) return;
      if (!confirm(`Slette brukeren til ${c.name}? De mister tilgangen med en gang. Bookingene deres blir liggende.`)) return;

    }));
    const saveFig = file => {
      const name = q("#figName").value.trim().slice(0, 30);
      guard(async () => {
        let img = S.figure?.img || "";
        if (file) img = await toThumb(file);

        await db.collection("assets").doc("figure").set({ img, name, at: Date.now() });
        flash(file ? "Figuren er lagret og står nå på kartet." : "Navnet er lagret.");

    q("#figFile").addEventListener("change", e => { const f = e.target.files?.[0]; if (f) saveFig(f); });
    q("#figSave").addEventListener("click", () => saveFig(null));
    q("#figDel")?.addEventListener("click", () => { if (confirm("Fjerne figuren fra kartet?")) guard(async () => { await db.collection("assets").doc("figure").delete(); flash("Figuren er fjernet."); }); });
  }
  async function toThumb(file) {
    const url = URL.createObjectURL(file);
    try {
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const side = Math.min(im.naturalWidth, im.naturalHeight), sx = (im.naturalWidth - side) / 2, sy = (im.naturalHeight - side) / 2;
      const c = document.createElement("canvas"); c.width = c.height = 200;
      c.getContext("2d").drawImage(im, sx, sy, side, side, 0, 0, 200, 200);
      return c.toDataURL("image/jpeg", 0.85);
    } finally { URL.revokeObjectURL(url); }
  }

  // ---------- render og navigasjon ----------
  function render() {
    const inside = S.auth === "in";
    renderGate();
    document.querySelector(".tabs").hidden = !inside;
    document.getElementById("viewPlan").hidden = !inside || S.view !== "plan";
    document.getElementById("viewCal").hidden = !inside || S.view !== "cal";
    document.getElementById("todaybar").innerHTML = `I dag: <b>${esc(fmtLong(TODAY))}</b> · uke ${isoWeek(TODAY)}`;
    if (!inside) return;
    renderAdmin();
    if (S.view === "plan") { renderDays(); renderPlan(); renderPanel(); renderMine(); }
    else renderCal();
  }
  function ensureRange() {
    if (!db || S.auth !== "in") return;
    const m = S.view === "cal" ? S.calMonth : monthOf(S.date);
    let from = monday(m + "-01"), to = addDays(monday(monthEnd(m)), 6);
    if (S.view === "plan") { const mon = monday(S.date); if (mon < from) from = mon; const sun = addDays(mon, 6); if (sun > to) to = sun; }
    const key = from + "|" + to;
    if (key === rangeKey) return;
    rangeKey = key;
    rangeUnsubs.forEach(u => u());
    S.loaded.bookings = S.loaded.away = false;
    rangeUnsubs = [["bookings", "bIdx"], ["away", "aIdx"]].map(([col, prop]) =>
      db.collection(col).where("date", ">=", from).where("date", "<=", to).onSnapshot(snap => {
        S[prop] = index(snap); S.loaded[col] = true; if (!snap.metadata.fromCache) markFresh(); render();
      }, onErr));
  }
  function route() {
    S.view = location.hash === "#kalender" ? "cal" : "plan";
    if (S.view === "cal" && !S._calSet) { S.calMonth = monthOf(S.date); S._calSet = true; }
    ensureRange(); render();
  }
  function select(id) { S.selected = id; S.msg = null; render(); if (id && window.matchMedia("(max-width: 980px)").matches) panel.scrollIntoView({ behavior: "smooth", block: "start" }); }
  function setDate(date) { S.date = weekday(date); S.calMonth = monthOf(S.date); S.msg = null; ensureRange(); render(); }
  function flash(text, err) { S.msg = { text, err: !!err }; render(); if (window.matchMedia("(max-width: 980px)").matches) panel.querySelector(".msg")?.scrollIntoView({ behavior: "smooth", block: "center" }); }

  // ---------- dataoperasjoner ----------
  async function guard(fn) {
    if (S.busy) return; S.busy = true; S.msg = null; render();
    try { await fn(); }
    catch (e) {
      console.error(e);
      if (e?.code === "permission-denied") flash("Du har ikke tilgang til å gjøre dette. Kontakt den som administrerer siden.", true);
      else if (e?.code === "resource-exhausted") flash("Dagens gratiskvote i Firebase er brukt opp. Prøv igjen i morgen.", true);
      else flash("Noe gikk galt under lagringen. Prøv igjen om litt.", true);
    } finally { S.busy = false; render(); }
  }
  const ovl = (s, e, a, b) => s < b && e > a;
  async function deskData(desk) {
    const [bq, aq] = await Promise.all([
      db.collection("bookings").where("desk", "==", desk).get(),
      db.collection("away").where("desk", "==", desk).get(),
    ]);
    return { bks: bq.docs.map(x => norm(x.id, x.data())), aws: aq.docs.map(x => norm(x.id, x.data())), hs: holdersOf(desk) };
  }
  const sendNotice = (to, text) => to && to !== S.me ? db.collection("notices").add({ to, from: S.me, text: text.replace(/\.\.$/, ".").slice(0, 280), at: Date.now() }) : Promise.resolve();
  const listDates = ds => ds.length > 6 ? `${ds.slice(0, 5).map(fmtShort).join(", ")} og ${ds.length - 5} dager til` : ds.map(fmtShort).join(", ");
  function book(desk, from, to, d1, d2, note, days, target) {
    const s = toMin(from), e = toMin(to);
    if (!from || !to || e <= s) { flash("Til-klokkeslettet må være etter fra-klokkeslettet.", true); return; }
    guard(async () => {
      const dates = workdaysBetween(d1, d2).filter(d => days.includes(dow(d)));
      if (!dates.length) { flash("Ingen arbeidsdager i det valgte tidsrommet.", true); return; }
      const { bks, aws, hs } = await deskData(desk);
      const sameAsTarget = b => b.uid === target.uid && (b.guest || "") === (target.guest || "");
      const plan = dates.map(date => {
        const dayB = bks.filter(b => b.date === date);
        const cB = dayB.filter(b => !sameAsTarget(b) && ovl(s, e, b.s, b.e));
        const own = dayB.filter(b => sameAsTarget(b) && ovl(s, e, b.s, b.e));
        const dayA = aws.filter(a => a.date === date);
        const cF = [];
        for (const h of hs) { if (h.uid === target.uid && !target.guest) continue;
          for (const [fs, fe] of fixedParts(h, date, dayB, dayA)) if (ovl(s, e, fs, fe)) cF.push({ h, s: Math.max(s, fs), e: Math.min(e, fe) }); }
        return { date, cB, cF, dup: own.length > 0 };
      }).filter(p => !p.dup);
      if (!plan.length) { flash("Dette er allerede booket.", true); return; }
      const conflicts = plan.filter(p => p.cB.length || p.cF.length);
      let take = plan;
      if (conflicts.length) {
        const byPerson = new Map();
        for (const p of conflicts) {
          for (const b of p.cB) { const k = b.guest ? `${b.guest} (gjest)` : fullName(b.uid); if (!byPerson.has(k)) byPerson.set(k, new Set()); byPerson.get(k).add(p.date); }
          for (const c of p.cF) { const k = fullName(c.h.uid) + " (fast plass)"; if (!byPerson.has(k)) byPerson.set(k, new Set()); byPerson.get(k).add(p.date); }
        }
        const lines = [...byPerson].map(([k, set]) => `• ${k}: ${listDates([...set].sort())}`).join("\n");
        const ok = confirm(`Plass ${DESK[desk].num} er allerede booket ${span(s, e)}:\n\n${lines}\n\nEr du sikker på at du vil booke likevel? Dette fjerner bookingen til personene over på disse dagene. De får beskjed når de logger inn.`);
        if (!ok) {
          take = plan.filter(p => !p.cB.length && !p.cF.length);
          if (!take.length || !confirm(`Vil du heller bare booke dagene som er ledige (${take.length} ${take.length === 1 ? "dag" : "dager"})?`)) { flash("Ingenting ble booket."); return; }
        }
      }
      const me = fullName(S.me);
      const victims = new Map(); // uid -> datoer
      let made = 0;
      for (const p of take) {
        for (const b of p.cB) {
          await db.collection("bookings").doc(b.id).delete();
          if (b.uid !== S.me) { if (!victims.has(b.uid)) victims.set(b.uid, []); victims.get(b.uid).push(p.date); }
          if (b.by && b.by !== b.uid && b.by !== S.me) { if (!victims.has(b.by)) victims.set(b.by, []); victims.get(b.by).push(p.date); }
        }
        for (const c of p.cF) {
          await db.collection("away").add({ desk, date: p.date, start: toHHMM(c.s), end: toHHMM(c.e), uid: c.h.uid, by: S.me, note: `Overtatt av ${me}`.slice(0, 120), at: Date.now() });
          if (!victims.has(c.h.uid)) victims.set(c.h.uid, []); victims.get(c.h.uid).push(p.date);
        }
        const doc = { desk, date: p.date, start: toHHMM(s), end: toHHMM(e), uid: target.uid, by: S.me, note, at: Date.now() };
        if (target.guest) doc.guest = target.guest.slice(0, 60);
        await db.collection("bookings").add(doc);
        made++;
        if (take.length > 10 && made % 10 === 0) flash(`Booker … ${made} av ${take.length}`);
      }
      for (const [uid, ds] of victims) await sendNotice(uid, `${me} har overtatt plass ${DESK[desk].num} (${span(s, e)}) ${listDates([...new Set(ds)].sort())}.`);
      if (target.uid !== S.me && !target.guest) await sendNotice(target.uid, `${me} har booket plass ${DESK[desk].num} til deg ${span(s, e)} ${listDates(take.map(p => p.date))}.`);
      const forTxt = target.guest ? ` for ${target.guest}` : target.uid !== S.me ? ` for ${fullName(target.uid)}` : "";
      flash(`Booket plass ${DESK[desk].num}${forTxt} ${span(s, e)}${made > 1 ? ` på ${made} dager` : ""}${days.length < 5 && made > 1 ? ` (${fmtDays(days)})` : ""}.${victims.size ? " De som mistet plassen, har fått beskjed." : ""}`);
    });
  }
  function cancel(id) {
    guard(async () => {
      const ref = db.collection("bookings").doc(id); const cur = await ref.get();
      if (!cur.exists) return;
      const b = cur.data();
      if (b.uid === S.me || b.by === S.me || S.admin) { await ref.delete(); flash("Bookingen er avbestilt."); }
    });
  }
  function markAway(desk, d1, d2, from, to, note) {
    const s = toMin(from), e = toMin(to);
    if (!from || !to || e <= s) { flash("Til-klokkeslettet må være etter fra-klokkeslettet.", true); return; }
    guard(async () => {
      const days = workdaysBetween(d1, d2);
      for (const date of days) await db.collection("away").add({ desk, date, start: toHHMM(s), end: toHHMM(e), uid: S.me, by: S.me, note, at: Date.now() });
      flash(days.length ? `Plass ${DESK[desk].num} er ledig for andre ${span(s, e)} ${days.length === 1 ? fmtShort(days[0]) : `på ${days.length} dager (${fmtShort(days[0])} – ${fmtShort(days[days.length - 1])})`}.` : "Ingen arbeidsdager i det valgte tidsrommet.", !days.length);
    });
  }
  function undoAway(id) {
    guard(async () => {
      const ref = db.collection("away").doc(id); const cur = await ref.get();
      if (!cur.exists) return;
      const a = norm(id, cur.data());
      const { bks } = await deskData(a.desk);
      const clash = bks.filter(b => b.date === a.date && b.uid !== S.me && b.s < a.e && b.e > a.s);
      await ref.delete();
      flash(clash.length ? `Plassen er din igjen, men ${clash.map(b => who(b)).join(", ")} har allerede booket den ${clash.map(b => span(b.s, b.e)).join(", ")}. Den bookingen gjelder fortsatt.` : `Du sitter på plassen igjen ${fmtShort(a.date)}.`, !!clash.length);
    });
  }
  function saveFixed(desk, sched) {
    guard(async () => {
      const mine = { days: sched.days, hours: sched.hours };
      const all = [...S.holders.values()].flat();
      // Andre på samme pult som overlapper → de mister de dagene
      const changes = []; // {h, removeDays}
      for (const h of all) {
        if (h.desk !== desk && h.uid !== S.me) continue;
        if (h.desk === desk && h.uid === S.me) continue;
        const rm = sched.days.filter(w => { const a = hSpan(h, w), b = hSpan(mine, w); return a && b && ovl(a[0], a[1], b[0], b[1]); });
        if (rm.length) changes.push({ h, rm });
      }
      const others = changes.filter(c => c.h.uid !== S.me);
      const myOther = changes.filter(c => c.h.uid === S.me);
      if (others.length || myOther.length) {
        const lines = [
          ...others.map(c => `• ${fullName(c.h.uid)} mister sin faste plass på ${joinOg(c.rm.map(w => WD_LONG[w]))}`),
          ...myOther.map(c => `• Din faste plass ${DESK[c.h.desk]?.num} blir ledig på ${joinOg(c.rm.map(w => WD_LONG[w]))}`),
        ].join("\n");
        if (!confirm(`Dette overlapper med andre faste plasser:\n\n${lines}\n\nVil du fortsette?`)) { flash("Ingenting ble endret."); return; }
      }
      for (const { h, rm } of changes) {
        const left = hDays(h).filter(w => !rm.includes(w));
        const ref = db.collection("fixed").doc(h.id);
        if (!left.length) await ref.delete();
        else {
          const hours = {}; for (const w of left) { const sp = hSpan(h, w); hours[String(w)] = [toHHMM(sp[0]), toHHMM(sp[1])]; }
          await ref.set({ desk: h.desk, uid: h.uid, note: h.note || "", at: Date.now(), days: left, hours });
        }
        if (h.uid !== S.me) await sendNotice(h.uid, `${fullName(S.me)} har tatt over plass ${DESK[h.desk]?.num} som fast plass på ${joinOg(rm.map(w => WD_LONG[w]))}.${left.length ? ` Du har den fortsatt på ${joinOg(left.map(w => WD_LONG[w]))}.` : " Du har ikke lenger fast plass der."}`);
      }
      const myId = `${desk}__${S.me}`;
      const legacy = holdersOf(desk).find(h => h.uid === S.me && h.id !== myId);
      await db.collection("fixed").doc(myId).set({ desk, uid: S.me, note: legacy?.note || "", at: Date.now(), days: mine.days, hours: mine.hours });
      if (legacy) await db.collection("fixed").doc(legacy.id).delete();
      flash(`Plass ${DESK[desk].num} er din faste plass: ${fmtSched(mine)}.`);
    });
  }
  function releaseFixed(hid) {
    if (!confirm("Gi fra deg den faste plassen?")) return;
    guard(async () => { await db.collection("fixed").doc(hid).delete(); flash("Du har ikke lenger denne faste plassen."); });
  }
  function saveInitials(v) {
    const ini = String(v || "").trim().toUpperCase().replace(/[^A-ZÆØÅ0-9]/g, "").slice(0, 3);
    if (!ini) { flash("Skriv 1–3 bokstaver.", true); return; }
    guard(async () => { await db.collection("members").doc(S.me).update({ initials: ini }); flash(`Initialene dine er nå ${ini}.`); });
  }

  // ---------- banner og abonnementer ----------
  const banner = document.getElementById("banner");
  let fresh = false, slowTimer = null;
  function setBanner(text, warn) { banner.hidden = !text; banner.textContent = text || ""; banner.classList.toggle("warn", !!warn); }
  function markFresh() { if (fresh) return; if (S.loaded.fixed && S.loaded.bookings && S.loaded.away) { fresh = true; clearTimeout(slowTimer); setBanner(""); } }
  function onErr(e) { clearTimeout(slowTimer); setBanner(e?.code === "permission-denied" ? "Du har ikke (lenger) tilgang. Last inn siden på nytt." : "Kunne ikke hente bookinger. Last inn siden på nytt.", true); }

  // ---------- innlogging med personlig kode ----------
  const gate = document.getElementById("gate");
  function renderGate() {
    const st = S.auth;
    gate.hidden = st === "in";
    if (st === "in") return;
    const err = gateMsg ? `<div class="msg err" role="status">${esc(gateMsg)}</div>` : "";
    if (st === "config") { gate.innerHTML = `<h2>Firebase er ikke satt opp</h2><p>Lim inn firebaseConfig øverst i index.html (se README).</p>`; return; }
    if (st === "loading") { gate.innerHTML = `<p>Logger inn…</p>`; return; }
    if (gate.querySelector("#codeForm")) { const m = gate.querySelector(".msg"); if (m) m.remove(); if (err) gate.querySelector("#codeForm").insertAdjacentHTML("beforebegin", err); return; }
    gate.innerHTML = `<h2>Logg inn</h2>
      <p>Skriv inn den personlige koden du har fått.</p>
      ${err}
      <form id="codeForm" style="width:100%"><div class="addrow">
        <input id="codeIn" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Din kode" aria-label="Kode" required>
        <button class="btn" type="submit">Logg inn</button></div></form>`;
    gate.querySelector("#codeForm").addEventListener("submit", ev => { ev.preventDefault(); loginCode(gate.querySelector("#codeIn").value); });
    gate.querySelector("#codeIn").focus();
  }
  async function loginCode(raw) {
    const code = normCode(raw);
    if (!code) return;
    if (!CODE_RE.test(code)) { gateMsg = "Ukjent kode. Sjekk at du har skrevet den riktig."; render(); return; }
    gateMsg = ""; loggingIn = true; stopAll(); S.auth = "loading"; gate.innerHTML = ""; render();
    try {
      if (!auth.currentUser) await auth.signInAnonymously();
      await db.collection("sessions").doc(auth.currentUser.uid).set({ code, at: Date.now() });
      loggingIn = false;
      await enter(auth.currentUser);
    } catch (e) {
      loggingIn = false;
      gateMsg = e?.code === "permission-denied" ? "Ukjent kode. Sjekk at du har skrevet den riktig."
        : e?.code === "auth/operation-not-allowed" || e?.code === "auth/admin-restricted-operation" ? "Anonym innlogging er ikke slått på i Firebase (Authentication → Sign-in method → Anonymous)."
        : "Innloggingen mislyktes: " + (e?.message || e);
      S.auth = "out"; render();
    }
  }
  async function logout() {
    try { if (auth.currentUser) await db.collection("sessions").doc(auth.currentUser.uid).delete(); } catch (e) {}
    gateMsg = ""; stopAll(); S.auth = "out"; gate.innerHTML = ""; render();
  }
  function stopAll() {
    subs.forEach(u => u()); subs = [];
    rangeUnsubs.forEach(u => u()); rangeUnsubs = []; rangeKey = null;
    S.holders = new Map(); S.bIdx = new Map(); S.aIdx = new Map(); S.myBookings = []; S.myAway = []; S.codes = []; S.notices = []; S.members = {}; S.figure = null;
    S.loaded = { fixed: false, bookings: false, away: false }; S.me = null; S.admin = false; S.dbOk = null; S.selected = null; S.code = "";
    fresh = false; panelSig = ""; mineSig = ""; adminSig = "";
    setupWalker();
    const chip = document.getElementById("me"); chip.hidden = true; chip.innerHTML = "";
  }
  async function enter(u) {
    if (loggingIn) return;
    stopAll();
    if (!u) { S.auth = "out"; setBanner(""); render(); return; }
    S.auth = "loading"; render();
    let code = null, info = null;
    try {
      const s = await db.collection("sessions").doc(u.uid).get();
      code = s.exists ? s.data().code : null;
      if (code) { const c = await db.collection("codes").doc(code).get(); info = c.exists ? c.data() : null; }
    } catch (e) { console.warn(e); }
    if (!info) {
      if (code) gateMsg = "Koden din er ikke gyldig lenger. Be om en ny kode.";
      S.auth = "out"; setBanner(""); gate.innerHTML = ""; render(); return;
    }
    S.auth = "in"; S.me = info.member; S.code = code; S.admin = info.admin === true; S.dbOk = true; S.canWrite = true;
    S.names[S.me] = info.name || "Deg";

    const chip = document.getElementById("me");
    chip.hidden = false; chip.innerHTML = "";
    const sp = document.createElement("span"); sp.textContent = info.name || "Deg"; sp.style.paddingLeft = "8px";
    const out = document.createElement("button"); out.type = "button"; out.textContent = "Logg ut"; out.addEventListener("click", logout);
    chip.append(sp, out);

    setBanner("Henter reservasjoner…");
    clearTimeout(slowTimer);
    slowTimer = setTimeout(() => { if (!fresh) setBanner("Får ikke kontakt med databasen ennå. Det som vises kan være utdatert.", true); }, 10000);
    subs.push(db.collection("fixed").onSnapshot(snap => {
      const m = new Map();
      snap.docs.forEach(d => { const v = d.data(); const desk = v.desk || d.id; if (!DESK[desk]) return; if (!m.has(desk)) m.set(desk, []); m.get(desk).push({ id: d.id, desk, uid: v.uid, note: v.note || "", days: v.days, hours: v.hours || null }); });
      S.holders = m; S.loaded.fixed = true; if (!snap.metadata.fromCache) markFresh(); render();
    }, onErr));
    subs.push(db.collection("members").onSnapshot(snap => {
      const mem = {};
      snap.docs.forEach(d => { const v = d.data(); S.names[d.id] = v.name || "En kollega"; mem[d.id] = v.name || "En kollega"; if (v.initials) S.inits[d.id] = v.initials; else delete S.inits[d.id]; });
      S.members = mem; render();
    }, () => {}));
    subs.push(db.collection("bookings").where("uid", "==", S.me).onSnapshot(snap => { S.myBookings = snap.docs.map(d => norm(d.id, d.data())).filter(b => b.date >= TODAY); render(); }, () => {}));
    subs.push(db.collection("away").where("uid", "==", S.me).onSnapshot(snap => { S.myAway = snap.docs.map(d => norm(d.id, d.data())).filter(b => b.date >= TODAY); render(); }, () => {}));
    subs.push(db.collection("notices").where("to", "==", S.me).onSnapshot(snap => { S.notices = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.at || 0) - (a.at || 0)); render(); }, () => {}));
    subs.push(db.collection("assets").doc("figure").onSnapshot(d => { S.figure = d.exists ? d.data() : null; setupWalker(); render(); }, () => {}));
    if (S.admin) subs.push(db.collection("codes").onSnapshot(snap => {
      S.codes = snap.docs.map(d => ({ code: d.id, ...d.data() })).sort((a, b) => String(a.name).localeCompare(String(b.name), "nb"));
      render();
    }, () => {}));
    ensureRange();
    render();
  }

  // ---------- kontroller ----------
  document.getElementById("prevW").addEventListener("click", () => setDate(addDays(monday(S.date), -7)));
  document.getElementById("nextW").addEventListener("click", () => setDate(addDays(monday(S.date), 7)));
  document.getElementById("todayBtn").addEventListener("click", () => setDate(TODAY));
  document.getElementById("jumpDate").addEventListener("change", e => { if (e.target.value) setDate(e.target.value); });
  document.getElementById("prevM").addEventListener("click", () => { S.calMonth = addMonths(S.calMonth, -1); ensureRange(); render(); });
  document.getElementById("nextM").addEventListener("click", () => { S.calMonth = addMonths(S.calMonth, 1); ensureRange(); render(); });
  document.getElementById("thisM").addEventListener("click", () => { S.calMonth = monthOf(TODAY); ensureRange(); render(); });
  window.addEventListener("hashchange", route);

  drawBase(); drawDesks();
  // På mobil: start kartet midt på i stedet for helt til venstre
  let centered = false;
  const centerPlan = () => { const sc = document.querySelector(".planscroll"); if (!centered && sc && sc.scrollWidth > sc.clientWidth && sc.clientWidth > 0) { sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) * 0.6; centered = true; } };
  new MutationObserver(centerPlan).observe(document.getElementById("viewPlan"), { attributes: true });
  (function start() {
    route();
    const cfg = FIREBASE_CONFIG;
    if (!window.firebase || !cfg.apiKey || cfg.apiKey === "LIM-INN") { S.auth = "config"; setBanner(""); render(); return; }
    firebase.initializeApp(cfg);
    auth = firebase.auth();
    db = firebase.firestore();
    auth.onAuthStateChanged(u => { enter(u).catch(e => { console.error(e); setBanner("Noe gikk galt ved innlogging. Last inn siden på nytt.", true); }); });
    render();
  })();
})();
</script>
</body>
</html>
